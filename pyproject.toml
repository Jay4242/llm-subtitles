[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-subtitles"
version = "0.1.0"
description = "Transcribe audio/video files into timestamped subtitles using a local multimodal LLM"
readme = "SPEC.md"
license = { text = "GPL v3" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx[http2]>=0.25",
    "numpy>=1.24",
    "soundfile>=0.12",
    "librosa>=0.10",
    "onnxruntime>=1.16",
    "pysubs2>=1.6",
    "rich>=13.0",
    "toml>=0.10",
]

[project.optional-dependencies]
forced-alignment = [
    "torch>=2.0",
    "torchaudio>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.scripts]
llm-subtitles = "llm_subtitles.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
